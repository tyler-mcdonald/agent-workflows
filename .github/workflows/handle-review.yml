name: Handle review

on:
  workflow_call:
    inputs:
      extra_allowed_tools:
        description: "Comma-separated tools to allow on top of the defaults, e.g. Bash(make:*)"
        type: string
        required: false
        default: ""
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true

jobs:
  handle:
    if: >-
      github.event_name == 'pull_request_review' &&
      (github.event.review.user.login == github.repository_owner ||
       github.event.review.user.login == 'coderabbitai[bot]') &&
      !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: agent-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    steps:
      - id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          REVIEW_ID: ${{ github.event.review.id }}
          REVIEW_STATE: ${{ github.event.review.state }}
          REVIEW_BODY: ${{ github.event.review.body }}
          COMMIT: ${{ github.event.review.commit_id }}
        run: |
          skip() { echo "Skipping: $1"; echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0; }
          if [ "$REVIEW_STATE" = "approved" ] && [ -z "$REVIEW_BODY" ] &&
             [ "$(gh api "repos/$REPO/pulls/$PR/reviews/$REVIEW_ID/comments" --jq length)" = "0" ]; then
            skip "empty approval"
          fi
          if [ "$(gh api "repos/$REPO/commits/$COMMIT" --jq .commit.author.name)" = "claude[bot]" ]; then
            skip "reviewed commit is Claude's"
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - if: steps.guard.outputs.skip == 'false'
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - if: steps.guard.outputs.skip == 'false'
        uses: actions/checkout@v7
        with:
          repository: tyler-mcdonald/skills
          path: .skills-src
          persist-credentials: false

      - if: steps.guard.outputs.skip == 'false'
        run: mkdir -p ~/.claude && mv .skills-src ~/.claude/skills

      - if: steps.guard.outputs.skip == 'false'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: coderabbitai
          bot_name: claude[bot]
          bot_id: "209825114"
          prompt: "/handle-pr-review ${{ github.event.pull_request.html_url }}"
          claude_args: |
            --max-turns 60
            --allowedTools "Bash(gh:*),Bash(git:*),Bash(~/.claude/skills/*),Read,Edit,Write,Glob,Grep${{ inputs.extra_allowed_tools != '' && format(',{0}', inputs.extra_allowed_tools) || '' }}"
