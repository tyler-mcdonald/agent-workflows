name: Handle review

on:
  workflow_call:
    inputs:
      model:
        description: "Model the agent runs on"
        type: string
        required: false
        default: "claude-opus-5-5"
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true

jobs:
  gate:
    permissions: {}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.event.outputs.run }}
      pr_number: ${{ steps.event.outputs.pr_number }}
      pr_url: ${{ steps.event.outputs.pr_url }}
    env:
      BODY: ${{ github.event.comment.body || github.event.review.body }}
      AUTHOR: ${{ github.event.comment.user.login || github.event.review.user.login }}
      PR_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
      PR_URL: ${{ github.event.issue.pull_request.html_url || github.event.pull_request.html_url }}
    steps:
      - name: Read event
        id: event
        env:
          RUN: >-
            ${{
              env.PR_URL != '' &&
              (startsWith(env.BODY, '@claude ') || env.BODY == '@claude') &&
              env.AUTHOR == github.repository_owner
            }}
        run: |
          {
            echo "run=$RUN"
            echo "pr_number=$PR_NUMBER"
            echo "pr_url=$PR_URL"
          } >> "$GITHUB_OUTPUT"

  handle:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: agent-pr-${{ needs.gate.outputs.pr_number }}
      cancel-in-progress: false
    steps:
      - name: Look up PR
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ needs.gate.outputs.pr_number }}
        run: >-
          gh pr view "$PR" --repo "$REPO"
          --json isCrossRepository,headRefName
          --jq '"is_fork=\(.isCrossRepository)\nhead_ref=\(.headRefName)"'
          >> "$GITHUB_OUTPUT"

      - name: Reject fork PRs
        if: steps.pr.outputs.is_fork == 'true'
        env:
          PR: ${{ needs.gate.outputs.pr_number }}
        run: |
          echo "::error::PR #$PR comes from a fork; handle-review only supports same-repo branches."
          exit 1

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.pr.outputs.head_ref }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/checkout@v7
        with:
          repository: tyler-mcdonald/skills
          path: .skills-src
          persist-credentials: false

      - run: mkdir -p ~/.claude && mv .skills-src ~/.claude/skills

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          bot_name: claude[bot]
          bot_id: "209825114"
          prompt: |
            /handle-pr-review ${{ needs.gate.outputs.pr_url }}
            ${{ github.event.comment.body || github.event.review.body }}
          claude_args: |
            --max-turns 60
            --model ${{ inputs.model }}
            --permission-mode auto
            --disallowedTools "Bash(gh pr merge *),Bash(gh api *merge*)"
