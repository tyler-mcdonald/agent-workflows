name: Handle review

on:
  workflow_call:
    inputs:
      model:
        description: "Model the agent runs on"
        type: string
        required: false
        default: "claude-opus-5-5"
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true

jobs:
  gate:
    # Run only for the repo owner's PR comment or review starting with @claude, or reply to Claude in a review thread.
    if: >-
      (github.event.issue.pull_request.html_url || github.event.pull_request.html_url) &&
      (
        startsWith(github.event.comment.body || github.event.review.body, '@claude ') ||
        (github.event.comment.body || github.event.review.body) == '@claude' ||
        (github.event_name == 'pull_request_review_comment' && github.event.comment.in_reply_to_id)
      ) &&
      (github.event.comment.user.login || github.event.review.user.login) == github.repository_owner
    permissions:
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      pr_number: ${{ steps.event.outputs.pr_number }}
      pr_url: ${{ steps.event.outputs.pr_url }}
      run: ${{ steps.event.outputs.tagged == 'true' || steps.reply.outputs.to_claude == 'true' }}
      reply: ${{ steps.event.outputs.tagged != 'true' }}
    env:
      PR_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
      PR_URL: ${{ github.event.issue.pull_request.html_url || github.event.pull_request.html_url }}
      BODY: ${{ github.event.comment.body || github.event.review.body }}
    steps:
      - name: Read event
        id: event
        run: |
          tagged=false
          if [ "$BODY" = "@claude" ] || [ "${BODY#@claude }" != "$BODY" ]; then
            tagged=true
          fi
          {
            echo "pr_number=$PR_NUMBER"
            echo "pr_url=$PR_URL"
            echo "tagged=$tagged"
          } >> "$GITHUB_OUTPUT"

      - name: Check reply is to Claude
        id: reply
        if: steps.event.outputs.tagged != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ROOT_ID: ${{ github.event.comment.in_reply_to_id }}
          COMMENT_ID: ${{ github.event.comment.id }}
        run: |
          prev_author=$(gh api --paginate --slurp "repos/$REPO/pulls/$PR_NUMBER/comments" | jq -r \
            --argjson root "$ROOT_ID" --argjson id "$COMMENT_ID" \
            '[add[] | select((.id == $root or .in_reply_to_id == $root) and .id < $id)] | sort_by(.id) | last | .user.login // ""')
          echo "Previous comment in thread by: $prev_author"
          echo "to_claude=$([ "$prev_author" = "claude[bot]" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  handle:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: agent-pr-${{ needs.gate.outputs.pr_number }}
      cancel-in-progress: false
    steps:
      - name: React to trigger
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          SUBJECT_ID: ${{ github.event.comment.node_id || github.event.review.node_id }}
        run: >-
          gh api graphql
          -f subjectId="$SUBJECT_ID"
          -f query='mutation($subjectId: ID!) { addReaction(input: {subjectId: $subjectId, content: EYES}) { clientMutationId } }'

      - name: Look up PR
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ needs.gate.outputs.pr_number }}
        run: >-
          gh pr view "$PR" --repo "$REPO"
          --json isCrossRepository,headRefName
          --jq '"is_fork=\(.isCrossRepository)\nhead_ref=\(.headRefName)"'
          >> "$GITHUB_OUTPUT"

      - name: Reject fork PRs
        if: steps.pr.outputs.is_fork == 'true'
        env:
          PR: ${{ needs.gate.outputs.pr_number }}
        run: |
          echo "::error::PR #$PR comes from a fork; handle-review only supports same-repo branches."
          exit 1

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.pr.outputs.head_ref }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/checkout@v7
        with:
          repository: tyler-mcdonald/skills
          path: .skills-src
          persist-credentials: false

      - run: mkdir -p ~/.claude && mv .skills-src ~/.claude/skills

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          bot_name: claude[bot]
          bot_id: "209825114"
          prompt: |
            /handle-pr-review ${{ needs.gate.outputs.pr_url }}
            Triggered by ${{ github.event.comment.html_url || github.event.review.html_url }} (${{ github.event_name }}):
            ${{ github.event.comment.body || github.event.review.body }}
            ${{ needs.gate.outputs.reply == 'true' && 'This is a reply to you in a review thread: only handle that thread.' || '' }}
          claude_args: |
            --max-turns 60
            --model ${{ inputs.model }}
            --permission-mode auto
