name: Handle review

on:
  workflow_call:
    inputs:
      model:
        description: "Model the agent runs on"
        type: string
        required: false
        default: "claude-opus-5-5"
      agent_instructions_repo:
        description: "Repo (owner/name) to load user-level agent instructions from; empty skips loading"
        type: string
        required: false
        default: ""
      agent_instructions_path:
        description: "Path of the agent instructions file in agent_instructions_repo"
        type: string
        required: false
        default: "claude/CLAUDE.md"
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true
      AGENT_INSTRUCTIONS_REPO_TOKEN:
        required: false

jobs:
  gate:
    # Run only for a PR comment or review starting with @claude, from the repo owner.
    if: >-
      (github.event.issue.pull_request.html_url || github.event.pull_request.html_url) &&
      (
        startsWith(github.event.comment.body || github.event.review.body, '@claude ') ||
        startsWith(github.event.comment.body || github.event.review.body, fromJSON('"@claude\n"')) ||
        startsWith(github.event.comment.body || github.event.review.body, fromJSON('"@claude\r\n"')) ||
        (github.event.comment.body || github.event.review.body) == '@claude'
      ) &&
      (github.event.comment.user.login || github.event.review.user.login) == github.repository_owner
    permissions: {}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      pr_number: ${{ steps.event.outputs.pr_number }}
      pr_url: ${{ steps.event.outputs.pr_url }}
    env:
      PR_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
      PR_URL: ${{ github.event.issue.pull_request.html_url || github.event.pull_request.html_url }}
    steps:
      - name: Read event
        id: event
        run: |
          {
            echo "pr_number=$PR_NUMBER"
            echo "pr_url=$PR_URL"
          } >> "$GITHUB_OUTPUT"

  handle:
    needs: gate
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: agent-pr-${{ needs.gate.outputs.pr_number }}
      cancel-in-progress: false
    steps:
      - name: React to trigger
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          SUBJECT_ID: ${{ github.event.comment.node_id || github.event.review.node_id }}
        run: >-
          gh api graphql
          -f subjectId="$SUBJECT_ID"
          -f query='mutation($subjectId: ID!) { addReaction(input: {subjectId: $subjectId, content: EYES}) { clientMutationId } }'

      - name: Look up PR
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ needs.gate.outputs.pr_number }}
        run: >-
          gh pr view "$PR" --repo "$REPO"
          --json isCrossRepository,headRefName
          --jq '"is_fork=\(.isCrossRepository)\nhead_ref=\(.headRefName)"'
          >> "$GITHUB_OUTPUT"

      - name: Reject fork PRs
        if: steps.pr.outputs.is_fork == 'true'
        env:
          PR: ${{ needs.gate.outputs.pr_number }}
        run: |
          echo "::error::PR #$PR comes from a fork; handle-review only supports same-repo branches."
          exit 1

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.pr.outputs.head_ref }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/checkout@v7
        with:
          repository: tyler-mcdonald/skills
          path: .skills-src
          persist-credentials: false

      - run: mkdir -p ~/.claude && mv .skills-src ~/.claude/skills

      - name: Validate agent instructions repo
        if: inputs.agent_instructions_repo != ''
        env:
          REPO: ${{ inputs.agent_instructions_repo }}
        shell: bash
        run: |
          if [[ ! "$REPO" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
            echo "::error::agent_instructions_repo must be owner/name, got '$REPO'"
            exit 1
          fi

      - name: Load agent instructions
        if: inputs.agent_instructions_repo != ''
        env:
          GH_TOKEN: ${{ secrets.AGENT_INSTRUCTIONS_REPO_TOKEN || github.token }}
          REPO: ${{ inputs.agent_instructions_repo }}
          FILE_PATH: ${{ inputs.agent_instructions_path }}
        shell: bash
        run: |
          encoded_path=$(jq -rn --arg p "$FILE_PATH" '$p | split("/") | map(@uri) | join("/")')
          file_content='if type == "object" and .type == "file" then .content else error("\(env.FILE_PATH) is not a file") end'
          gh api "repos/$REPO/contents/$encoded_path" --jq "$file_content" \
            | base64 -d > ~/.claude/CLAUDE.md

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          bot_name: claude[bot]
          bot_id: "209825114"
          prompt: |
            /handle-pr-review ${{ needs.gate.outputs.pr_url }}
            Triggered by ${{ github.event.comment.html_url || github.event.review.html_url }} (${{ github.event_name }}):
            ${{ github.event.comment.body || github.event.review.body }}
          claude_args: |
            --max-turns 60
            --model ${{ inputs.model }}
            --permission-mode auto
